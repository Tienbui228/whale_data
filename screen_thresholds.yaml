# screen_thresholds.yaml — SCREEN-tier thresholds cho gom_scan.py
# Operator chỉnh tự do; log thay đổi bên dưới.
# Ngưỡng signal canonical (lsr_accum, decay...) = thresholds.yaml LOCKED — không chỉnh ở đây.
#
# Changelog:
# 2026-08-08 v1.0: khởi tạo theo spec gom_detect_spec.md v1.1
# 2026-08-08 v1.1: GOM-B structural formula (B1 AND (B2|B3) AND B4); xóa gom_b_min_count;
#                  wrong_side_dq (L-26); DQ cooldown 14d from-first-fire
# 2026-08-08 v1.2: spec v1.3 correction — per-day DQ: thêm slope_5d_max; wrong_side_dq thêm 1d check (ret_1d_min/glsr_1d_min)
# 2026-08-11 v1.3: thêm a3_marginal_eps (display-only, không đổi eval behavior)

gom:
  # [v4.0 GOM-RESTRUCT-20260824 C1 disable GOM-C — operator ký chat 24/08]
  # GOM-C decommissioned per bot-signals gom_detect_spec v4.0-draft (8a96eacc):
  # "chưa từng bắn trước ignition ở 8 case proven; vai 'tiếp diễn' chuyển cho
  # crowd-flip/registry-wave". Set false → gom_scan bỏ qua GOM-C β check.
  gomc_enabled: false

  # §8.3 — ngày đếm Q1: ret_1d (price return 1d) phải ≤ max này
  ret_1d_max: 0.01          # +1.0%

  # §8.1 — chuỗi cho phép đứt ≤ break_gap_max ngày liên tiếp
  break_gap_max: 2

  # §8.4 (iv) — pos_r sập ≥ này từ peak → ĐÓNG chuỗi ngay (ghế rời)
  pos_r_drop_close: 0.30    # 30%

  # §8.5 — ngưỡng Q1_cum footer warning
  q1_cum_big_usd: 2_000_000  # $2M

  # §8.3 — VWAP fallback sang vol-weighted khi ΔOI ≈ 0 (seat-rotation)
  vwap_fallback_seats: true

  # §1 — GOM-B: structural formula B1 AND (B2|B3) AND B4 — không dùng count nữa
  # (gom_b_min_count REMOVED — count formula sai; B1 mandatory không thay thế được)

  # §2 — guards
  vol_low_conf_usd: 200_000   # vol_quote < 200K → low_conf flag
  oi_low_conf_usd: 1_000_000  # oi_usd < 1M → low_conf flag
  min_history_days: 14        # ký hiệu cần ≥14 ngày lịch sử

  # §1 GOM-A cond A4: hedge_structure lookback window (ngày) để check "backdrop"
  hedge_lookback_days: 7

  # §8.2 rule (ii) — crowd_flush chỉ trigger chapter mới nếu ≥ N ngày sạch kể từ flush trước
  # Chương rỗng (Q1=0) hợp lệ — không dùng Q1_cum guard nữa
  crowd_flush_gap_min_days: 3

  # §1 per-day DQ: slope_5d — lsr_global(i)/lsr_global(i-5) > threshold = distribution phase
  slope_5d_max: 1.15

  # A-tag: display [A3:marginal] when A3 passes but |slope - slope_5d_max| < this ε
  # display-only — does NOT change eval behavior. Hysteresis thật → cần re-gate riêng.
  a3_marginal_eps: 0.005   # đề xuất operator ký 08-11

  # M2: Tier-1 VWAP chỉ dùng khi vwap_den >= frac × oi_start (đại diện đủ trọng số)
  # Dưới ngưỡng → rơi xuống Tier-2 [vw-vol — seat-rotation chain]
  vwap_t1_min_rep_frac: 0.05   # 5% default; operator chỉnh tự do

  # §1 wrong-side DQ (L-26): per-day block (không cooldown 14d)
  # Hai check — (A) 5d cumulative; (B) 1d single-day
  wrong_side_dq:
    lookback_days:  5      # (A) window đo price + gLSR thay đổi
    px_drop_min:    0.10   # (A) giá rơi ≥ 10% trong lookback
    glsr_rise_min:  0.15   # (A) gLSR tăng ≥ 15% trong lookback
    ret_1d_min:     0.05   # (B) ret_1d ≤ -5% (1d check)
    glsr_1d_min:    0.05   # (B) gLSR_1d_chg ≥ +5% (1d check)

# ─────────────────────────────────────────────────────────────────────────────
# PHASE-TAG v0.3 §7 — SỔ NGƯỠNG TỰ CHẾ (7 con · display-layer, non-blocking)
# Spec: docs/proposals/phase_tag_spec_v0.3.md §7
# Trạng thái: PROVISIONAL — chờ calib phân bố §7 pass verdict + operator ký v0.4.
# ─────────────────────────────────────────────────────────────────────────────
phase_tag:
  # #1 herd_return: gLSR quay lại ≥80% pre-flush peak trong rolling-14d
  herd_return_ratio:     0.80    # PROVISIONAL — calib phân bố flush-event 70-fire+12-case
  herd_return_window:    14

  # #2 S0-POSTFLUSH: gLSR drop ≥40% từ peak 14d
  s0_postflush_drop:     0.40    # PROVISIONAL (n=2 anchor BANK/AKE flush)
  crowd_flush_lookback:  7       # cửa sổ "gần đây" cho crowd_flush

  # #3 CROWD-CHASE vế 2: gLSR +≥30%/3d
  crowd_chase_glsr_rise: 0.30    # soi-gương flush #2 (0 sáng tác)

  # #4 FUEL-STANDING: avg30(gLSR) ≤ 0.90 (neo biên subtype)
  fuel_standing_avg30:   0.90    # forward calib

  # #5 Sanity UNKNOWN: floor ≤40% universe/ngày
  sanity_unknown_max:    0.40    # floor thực dụng

  # #6 Transition-window khối 🔻: token MỚI vào S4/S5 ≤5d thì in
  transition_window_days: 5      # PROVISIONAL — calib dwell S3→S4 (BANK 19-21→24/07)

  # #7 B2h rolling-window LOCAL (KHÔNG đụng rule-iv canonical chain-lifetime)
  # Magnitude = pointer rule-iv (25%, đồng bộ khi rule-iv đổi) — spec §9.1.3
  # Window = tham số LOCAL stateless cho scanner/phase_tag.py::harvest_drop()
  b2h_window_days:       14      # PROVISIONAL — replay BANK 19-21/07 + TUT 02+05/08 phải bắn
  b2h_drop_min:          0.25    # POINTER rule-iv GOM §8 — không sáng tác riêng

# Ranh với thresholds.yaml LOCKED: 7 con trên KHÔNG đụng canonical signal params
# (ret_1d_max, funding_pinned, decay, dist_wall, lsr_dist, post_climax, funding_neg_div,
#  stealth_grind numbers, absorption). Display-layer only.

# ─────────────────────────────────────────────────────────────────────────────
# §E-R UN-HEDGE REGISTRY (proposals/unhedge_registry_spec_v1.0.md)
# Amendments applied: E-R4b v1.1 (operator ký 20/08/2026, r2=1.15)
# ─────────────────────────────────────────────────────────────────────────────
unhedge_registry:
  spec_version: "v1.0+E-R4b-v1.1"
  spec_source: "proposals/unhedge_registry_spec_v1.0.md"
  amendments_applied:
    - "E-R4b-v1.1-r2:1.15"   # operator ký 20/08/2026 (relay vá 3-lần-tuần)

  # E-R1 triggers
  drift_thr:       0.15    # (b) UNHEDGE-DRIFT: div drift ≥ +0.15 từ episode min
  drift_window:    7       # trong ≤ 7d
  pos_hold_ratio:  0.90    # (c) pos_r ≥ 90% × avg5(pre-event)
  px_hold_ratio:   0.85    # (d) px ≥ 85% × hedge_start_px

  # E-R3 IGNITE conditions
  ignite_oi_pct:   0.30    # OI +30%/2d
  ignite_oi_win:   2
  ignite_vol_mult: 5.0     # vol ≥ 5× med14
  ignite_brk_pct:  0.15    # breakout ≥ 15%/range14d

  # §E-R4b RE-ARM (v1.1, operator ký 20/08/2026, r2=1.15 ≥ không strict)
  rearm_r1_days:   14      # r1 days_since_ignite ≥ 14
  rearm_r2_px:     1.15    # r2 px_now / local_low_since_ignite ≥ 1.15
  rearm_r3_oi:    1.30    # r3 oi_now / oi_local_low_since_ignite ≥ 1.30

  # E-R4 outcomes
  rehedge_min_d:   5       # RE-HEDGED: new episode div_avg3 ≤0.5 ≥5d
  expire_days:     90      # EXPIRED: 90d không ignite

  # [r4 SIGNED 28/08 operator KÝ (ii) · 3 điều kiện thỏa]
  # §E-R4(r4) evidence flag — REPORT-ONLY augment (nâng re-arm conf + ⚡-watch)
  # State gate: token trong un-hedge ≤state_max_days ∨ RE-ARM state
  # PROVISIONAL free-layer chờ control-set
  er4_r4:
    pos_at_max30:      true      # pos_r_today = max(pos_r trailing 30d)
    pos_over_min14:    1.30      # pos_r_today / min(pos_r 14d) ≥ 1.30
    acc_over_max14:    0.50      # acc_r_today ≤ 0.50 × max(acc_r 14d)
    state_max_days:    30        # window state gate (un-hedge ≤30d)
    report_only_days:  30        # from go-live, 30d report-only trước ARMED

