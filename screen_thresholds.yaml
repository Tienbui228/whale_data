# ─────────────────────────────────────────────────────────────────────────────
# [GOI-NHE-20260829 · SIGNED] Compose gói-nhẹ + kho-ramp + tripwire 0.4
# ─────────────────────────────────────────────────────────────────────────────
goi_nhe:
  signed: true
  source: "operator ký chat 29/08 'ok gói-nhẹ'"
  # [rev4 v2.1-THẬT KÝ 27/08] canonical obs_min cho MỌI rolling-vế
  # (funding_14 hằng semantic 14 · px_15 hằng semantic 15 cần 14d-return ·
  #  ROLLING vế: floor_obs_min oi/vol lấy từ đây thay hằng)
  obs_min: 14
  compose_mode: "H1-raw OR H2-raw"          # bắn trần, không AND
  conf_mapping:
    HIGH:   4              # 4/4 sub-vé T0.1 pass (trên vế evaluable)
    MED:    [2, 3]         # 2-3 pass
    LOW:    [0, 1]         # 0-1 pass
    nan_policy: "N-A-KHONG-DEM"   # NaN in N/A, không đếm, không impute
    display_format: "conf=<LEVEL> (<pass>/<eval>; N/A: <list>)"
    apply_lane: "both"     # áp cả 2 lane {kho, perp}
  kho_ramp:
    delta_min:   0.15                  # Δ balance ≥ 15%
    window_days: 14                    # trong ≤ 14d
    provisional_ky_kem: true           # 30d report-only tự trả giá FP
    inclusive_D: true                  # mẫu balance(D-14) inclusive
    empty_or_na: "N-A-KHONG-FIRE"      # đầu 0/N/A → N/A không fire
    # [KÝ 27/08 confirm 0i-b — DEV ghi] ramp sống trên cron từ đêm đầu này:
    provisional_30d_start: "2026-08-28"  # đêm đầu ramp sống trên cron; 4 revs trước
                                          # (70678b7 → 531c4d1 → ec8782e → 0ef10f7)
                                          # chết silent — NameError _os_env nuốt bởi
                                          # except-pass; họ save_snapshot: L-28.
  # [E2-METRIC-20260831 KÝ 31/08 · v2] rate FP metric merged
  # Công thức v2 (ANALYSIS ký 31/08): rate = n_FP_graded / 52 / window_days × 30
  # Source: file grades MỚI NHẤT họ census_63_grades_* (md5 in header)
  # SELF-CHECK bắt buộc: kỳ vọng 0.428 trên grades v4 (lệch → DỪNG paste)
  # Output đêm: "tripwire FP-rate=<val> [TRIP|OK] · raw=<x> (context)"
  # Auto-untrip: chu kỳ re-grade 04:06 (≤0.4 → gỡ flag + Telegram note)
  # Wire: lib/tripwire_e2_v2.py · TREO chạy thật tới grades-v4 file vào repo
  tripwire_e2:
    trailing_days:       30
    max_alert_per_token: 0.4           # trần alert/token/30d hậu-cooldown
    action_if_trip:      "flag+Telegram+report_only"  # KHÔNG tự tắt (v1) / auto-untrip 04:06 (v2)
    control_universe:    52            # v2 canonical: control-52 hậu-cooldown (không 139)
    metric_version:      "v2-20260831"
    # [E2-METRIC-20260831 hai-chốt EXPOSURE · ANALYSIS ký 31/08]
    # chốt-1 EXPOSURE: cửa-sổ-fire THẾ HỆ census (min..max fire_date từ file), CỐ ĐỊNH
    # mọi chu kỳ re-grade cùng thế hệ. PENDING ngã → chỉ đổi TỬ số (n_FP); thế hệ mới
    # mang exposure riêng.
    # chốt-2 CÔNG THỨC: rate = n_FP × 30 / (52 × exposure_days)
    formula:             "n_FP × 30 / (52 × exposure_days)"
    grades_file_glob:    "docs/case_files/census_63_grades/census*grades*.csv"  # canonical dir · sửa 31/08 từ scratch/
    grades_selector:     "graded_at LATEST"  # chọn file graded_at mới nhất, không mtime
    # [Resolution (b) 31/08 · ANALYSIS chốt (a)] exposure = DECLARED (yaml single-source)
    # NOT min..max read from file. Min..max in-file chỉ sanity check phải ⊆ window.
    # Fire NGOÀI declared window → DỪNG thật.
    active_generation:   "gen_20260626"
    census_generations:
      gen_20260626:
        window:          "2026-06-26..2026-08-22"
        exposure_days:   58                                     # DECLARED CANONICAL
        grades_file:     "census_grades_v4_FULL85_20260831.csv"
        md5:             "8fdd0a74f0a615023209519996a96402"
        expected_rate:   0.428
        expected_breakdown:
          n_FP:      43
          n_TP:      7
          n_PENDING: 35
    tp_note:             "N TP control-nhiễm (round-trip |ret|<30%) — loại khỏi tử theo E2-metric 31/08"
    auto_untrip_at:      "04:06 UTC"   # chu kỳ re-grade
  # [KÝ 27/08 guard VERIFY-WALLETSET · PROVISIONAL-30d review cùng kho-ramp]
  # Kho out-step |Δ|≥50%/1d → render tag [VERIFY-WALLETSET] (display-only,
  # vẫn hiện đủ). Người soi kiểm nguồn (relabel/delist-migration/market-real)
  # trước khi tin thị-trường. KHÔNG chặn compose, KHÔNG khởi cooldown mới.
