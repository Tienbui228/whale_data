# GOM-H — HANDOFF & SEAT-LIFT (PROVISIONAL, unsigned per operator DEV-BỔ-SUNG v2)
# NGƯỠNG TẠM ANALYSIS xác nhận 24/08/2026 — chép nguyên văn per DEV-BỔ-SUNG v2 relay
# Spec: bot-signals/docs/gom_detect_spec.md v4.0-draft §1-H (24/08)
# Source: mm_stage_machine_v1_proposal_20260823 §6 — ANALYSIS HYP, fit trên 8 case
# Ref: proposals/adapter_h1_spec_v0.1_20260824.md (SIGNED 24/08 ĐIỂM DỪNG 1)
# ─────────────────────────────────────────────────────────────────────────────
gom_h:
  provisional_unsigned: true
  source: "mm_stage_machine_v1_proposal_20260823 §6 — ANALYSIS HYP, fit trên 8 case"

  # T0.1 compose (compose cần, cùng nhãn):
  # funding ghim ≥14d (|f_avg| ≤5e-5+ε) ∧ OI ≤1.2×min(oi, floor_basis) ∧ |ret14| ≤10% ∧ med7(vol) ≤ med30
  # [V⑤ 28/08 ANALYSIS ký] funding_pin inclusive-by-design: check abs(v) <= pin_abs + 1e-9
  # [V② 28/08 ANALYSIS ký] OI-FLOOR: min(available) với floor_obs_min=14 PROVISIONAL (chờ T-②)
  t0_1:
    funding_pin_days:   14        # |f_avg| ≤ funding_pin_abs trong ≥14d
    funding_pin_abs:    5.0e-5
    funding_pin_eps:    1.0e-9    # [V⑤] boundary inclusive ε (5e-5 = giá trị ghim, inclusive by design)
    oi_over_min30_max:  1.2       # OI ≤ 1.2 × min(oi available)
    floor_obs_min:      14        # [V② PROVISIONAL — chờ T-②] min N observations cho min(oi) floor
    ret14_abs_max:      0.10      # |ret14| ≤ 10%
    vol_med7_over_med30_max: 1.0  # med7(vol) ≤ med30(vol)

  # H1 KHO-STEP (adapter: proposals/adapter_h1_spec_v0.1_20260824.md):
