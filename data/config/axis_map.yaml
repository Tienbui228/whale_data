# G1-G3 numbers per operator directive V3.5. Constants = directive-verbatim,
# yaml chỉ mang số. EPISODE_GAP = shared constant across code + G3 sticky window.
direction_eval:
  status: PROVISIONAL          # signing_by operator directive V3.5 · control-27/09
  control_date: 2026-09-27     # revisit + ký chính thức
  g1_ret_pct_floor: 30         # G1 |ret_since_seed| ≥ 30% → floor POST (cấm PRE)
  g2_dd20_pct_ceiling: -40     # G2 dd20 ≤ -40% → POST-DUMP + XẢ-watch + câu-soi XẢ
  g3_sticky_window_days: 14    # = EPISODE_GAP (shared · một số một nghĩa)
  g3_reversal_stable_days: 7   # X = 7 · giá ổn X ngày ∧ kho đảo = mở lại PRE
  sticky_sources:              # as-printed (nguồn artifact)
    - "🔴 block artifact (gom_h_daily.log KHO ĐỘNG GIỮA ĐẠP)"
    - "walletset WASH-CRASH tag (h3 walletset flag)"
    - "phase S4/S5 (case_state_map)"
  ruling_source: "V3.5 directive KÝ 07/09 · control-27/09 revisit"


# AMD-07 CONCAT-XÁC-VẬT-LÝ · V3.5p (KÝ 10/09 · operator "ok concat-persist")
# Luật đối chứng vĩnh viễn:
#   md5sum(data/artifacts/master_concat_<target>.txt)[:12] ≡ concat-seal in footer cùng target
# Nghĩa: seal-domain bytes (body TRƯỚC dòng concat-seal) ghi ra file physical
# → phép thử tương lai chỉ md5 file, KHÔNG reproduce-từ-code (code drift chứng minh vô dụng)
# Harness p27 CONCAT-XÁC-VẬT-LÝ tự đối đẳng thức mỗi đêm · FAIL in đích danh
amd_07_concat_persist:
  status: ACTIVE
  signed: 2026-09-10
  file_pattern: "data/artifacts/master_concat_<target>.txt"
  invariant: "md5sum(file)[:12] ≡ concat-seal in footer"
  harness_pin: "p27"
