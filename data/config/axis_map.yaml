# Axis registry (canonical · KHÔNG rename một-nhát · L-51)
axes:
  fresh_wallets:
    getter: core_nansen._add_fresh_wallets
    fields: [usd_1d, delta_usd, prev_usd_1d, delta_hours, delta_days]
    unit: USD
    provenance: Nansen /flows label=fresh_wallets
    consumer: render_fresh_digest

  exchange_balance:
    getter: core_nansen._add_exchange_balance
    fields: [exchange_delta_usd, exchange_delta_pct, exchange_delta_tokens,
             exchange_balance_tokens, exchange_prev_date, exchange_balance_date,
             exchange_api_failed]
    unit: USD + tokens
    provenance: Nansen /flows label=exchange (native window · KHÔNG snapshot-pair)
    consumer: render_exchange_digest

  smart_trader:
    getter: core_nansen._add_smart_trader
    fields: [smart_trader_net_flow_usd, smart_trader_wallet_count]
    unit: USD
    provenance: Nansen /flows label=smart_trader
    consumer: (opt-in ALERT_CONFLUENCE)

  top_pnl:
    getter: core_nansen._add_top_pnl
    fields: [top_pnl_net_flow_usd, top_pnl_wallet_count]
    unit: USD
    provenance: Nansen /flows label=top_pnl
    consumer: (opt-in ALERT_CONFLUENCE)

  whale:
    getter: core_nansen._add_whale
    fields: [whale_net_flow_usd, whale_wallet_count]
    unit: USD
    provenance: Nansen /flows label=whale
    consumer: (TBD ANALYSIS)

  price_liquidity:
    getter: core_nansen._add_price_liquidity
    fields: [price_usd, market_cap, liquidity_usd]
    unit: USD
    provenance: DexScreener / GeckoTerminal (per _add_price_liquidity impl)
    consumer: all_axes (denominator cho %mcap)

# Renderer routing (§B skeleton · ANALYSIS chốt v1.1)
renderers:
  fresh_digest:
    consumes: [fresh_wallets, price_liquidity]
    file: scripts/digest_daily_vps.py::render_fresh_digest
    sidecar: sidecar/fresh_digest_<target_date>.jsonl

  exch_digest:
    consumes: [exchange_balance, price_liquidity]
    file: scripts/digest_daily_vps.py::render_exchange_digest
    sidecar: sidecar/exch_digest_<target_date>.jsonl

  gom_h_daily:
    consumes: [TBD]  # ANALYSIS chốt v1.1
    file: scripts/gom_h_daily.py::TBD_render_campaign_pre
    sidecar: sidecar/gom_h_daily_<target_date>.jsonl

  phase_map:
    consumes: [case_state_map]
    file: scripts/run_phase_tag.py::TBD_render_phase_scan
    sidecar: sidecar/phase_map_<target_date>.jsonl

  watchlist:
    consumes: [hedge_watchlist]
    file: (TBD)
    sidecar: sidecar/watchlist_<target_date>.jsonl

  gom_daily:
    consumes: [gom_h_daily_csv, exchange_balance]
    file: (TBD)
    sidecar: sidecar/gom_daily_<target_date>.jsonl

